[package]
name = "compositor"
version = "0.1.0"
edition = "2024"

[dependencies.smithay]
workspace = true
features = [
  "backend_drm",
  "backend_gbm",
  "backend_egl",
  "backend_libinput",
  "backend_session_libseat",
  "backend_udev",
  "backend_winit",
  "backend_vulkan",
  "backend_x11",
  "desktop",
  "renderer_glow",
  "renderer_multi",
  "renderer_pixman",
  "wayland_frontend",
  "xwayland",
]

[dependencies]
config = { path = "../config" }
protocols = { path = "../protocols" }
spacecontrol = { path = "../spacecontrol" }
crownos-config = { workspace = true }
crownos-protocols = { workspace = true, features = ["server"] }
anyhow = { workspace = true }
thiserror = { workspace = true }
calloop = { workspace = true }
parking_lot = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
smithay-drm-extras = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-journald = { workspace = true }
tracing-subscriber = { workspace = true }
wayland-server = { workspace = true }
tiny-skia = "0.12.0"
# XCursor theme lookup and file parsing, so `rendering::cursor` only has to
# decide *which* shape to draw, not how to find or decode it.
xcursor = "0.3.11"
cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash", "fontconfig", "sys-locale"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
wayland-protocols-plasma = { version = "0.3", default-features = false, features = ["server"] }

# A `wlr-randr` stand-in for developing the output-management protocol, built
# only for `examples/`. See `examples/wlr_outputs.rs`.
[dev-dependencies]
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", default-features = false, features = ["client"] }
wayland-protocols = { version = "0.32", default-features = false, features = ["staging", "client"] }
crownos-protocols = { workspace = true, features = ["client"] }

[[example]]
name = "wlr_outputs"

[[example]]
name = "color_info"

[[example]]
name = "liquid_glass"

[[example]]
name = "data_control_probe"
