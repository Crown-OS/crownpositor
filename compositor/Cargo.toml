[package]
name = "crownpositor"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["marvelxcodes <ramakrishnan0046@gmail.com>"]
repository = "https://github.com/Crown-OS/crownpositor"
homepage = "https://github.com/Crown-OS/crownpositor"
description = "Wayland compositor for CrownOS, built on Smithay."
keywords = ["crownos", "wayland", "compositor", "smithay", "tiling"]
categories = ["gui", "os::linux-apis"]
readme = "../README.md"
documentation = "https://docs.rs/crownpositor"

[dependencies.smithay]
version = "0.7.0"
default-features = false
features = [
  "backend_drm",
  "backend_gbm",
  "backend_egl",
  "backend_libinput",
  "backend_session_libseat",
  "backend_udev",
  "backend_winit",
  "backend_vulkan",
  "backend_x11",
  "desktop",
  "renderer_glow",
  "renderer_multi",
  "renderer_pixman",
  "wayland_frontend",
  "xwayland",
]

[dependencies]
config = { package = "crownpositor-config", path = "../config", version = "0.1.0" }
crownos-config = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
calloop = { workspace = true }
parking_lot = { workspace = true }
smithay-drm-extras = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
wayland-server = { workspace = true }
tiny-skia = "0.12.0"
# XCursor theme lookup and file parsing, so `rendering::cursor` only has to
# decide *which* shape to draw, not how to find or decode it.
xcursor = "0.3.11"
