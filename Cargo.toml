[workspace]
members = ["compositor", "config", "lockscreen", "protocols"]
resolver = "3"

[workspace.dependencies]
crownos-config = { git = "https://github.com/crown-os/crownos-config", default-features = false }

anyhow = "1.0.104"
thiserror = "2.0.20"
calloop = "0.14.4"
parking_lot = "0.12.5"
regex = "1.13.1"
serde = { version = "1.0", features = ["derive"] }
# Shared so the compositor and the protocol crate cannot drift onto two
# different smithay versions and two incompatible `WlSurface` types. Features
# are additive per member: `protocols` takes only `wayland_frontend`, the
# compositor adds the backends and renderers it needs.
smithay = { version = "0.7.0", default-features = false }
# default-features off: `display-info` links libdisplay-info < 0.3, which is
# newer on this system than the sys crate allows. We only need `drm_scanner`;
# EDID make/model naming can come back when the sys crate catches up.
smithay-drm-extras = { version = "0.1.0", default-features = false }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "time", "sync"] }
tracing = "0.1.44"
tracing-journald = "0.3.2"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wayland-server = "0.31.14"

# The compositor section is developed alongside the compositor, so build against
# the checkout next door rather than the last push.
[patch."https://github.com/crown-os/crownos-config"]
crownos-config = { path = "../crownos-config" }
